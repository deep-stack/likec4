# CI: reproduce origin repo checks on pull requests. Main pushes are checked by main.yml.
# Same jobs as main repo (checks.yaml) so PRs get typecheck, build, tests, docs, playground, e2e.
# Only runs on forks (if: github.repository != 'likec4/likec4'); no-op on origin.

name: CI (PR)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Caller must allow actions: write so reusable checks jobs can upload/download artifacts (GitHub caps token to caller permissions).
permissions:
  contents: read
  actions: write

jobs:
  checks:
    if: github.repository != 'likec4/likec4'
    uses: ./.github/workflows/checks.yaml
    secrets: inherit
